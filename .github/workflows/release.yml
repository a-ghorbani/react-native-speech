name: Release

# Auto-release on push to main is intentionally DISABLED: `main` is a
# protected branch and the Actions bot can't push release-it's version
# commit/tag (npm publish succeeds first, then the git push is rejected,
# leaving npm/git inconsistent). Re-enable the `push` trigger below once
# the bot is granted a branch-protection bypass (or we move to a
# release-PR flow). Until then this only runs when triggered manually.
on:
  workflow_dispatch:
    inputs:
      package:
        description: 'core: @pocketpalai/react-native-speech (v* tags); phonon: the add-on (phonon-v* tags)'
        type: choice
        options:
          - core
          - phonon
        default: core
  # push:
  #   branches: [main]

# Never run two releases at once; don't cancel a release mid-publish.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    # Skip the bot's own release commits ("chore: release x.y.z",
    # "chore(phonon): release x.y.z") so we don't loop.
    # Quoted because the `: ` inside 'chore: release' otherwise makes YAML
    # parse this as a nested mapping → workflow startup_failure.
    if: "${{ !startsWith(github.event.head_commit.message, 'chore: release') && !startsWith(github.event.head_commit.message, 'chore(phonon): release') }}"
    env:
      # A push run has no inputs: the core.
      PACKAGE: ${{ inputs.package || 'core' }}

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup
        uses: ./.github/actions/setup

      # Trusted publishing (OIDC) needs npm >= 11.5.1; the Node in .nvmrc
      # bundles npm 10.x, which can't do the OIDC token exchange. Pinned to 11:
      # npm 12 requires Node >= 22.22.2, newer than .nvmrc.
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@^11.5.1

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # --npm.skipChecks skips release-it's pre-flight `npm whoami`/collaborator
      # check, which fails under trusted publishing (no token in CI). The real
      # auth + provenance happen inside `npm publish` via OIDC.
      - name: Release
        if: env.PACKAGE == 'core'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: yarn release-it --ci --npm.skipChecks

      # Fails while phonon.lock.json pins an iOS zip with Apple AMX instructions (ITMS-90755).
      - name: Check the pinned Phonon iOS binaries
        if: env.PACKAGE == 'phonon'
        env:
          NDK_VERSION: '28.2.13676358'
        run: |
          { yes || true; } | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" >/dev/null
          export LLVM_OBJDUMP="$ANDROID_HOME/ndk/$NDK_VERSION/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-objdump"
          test -x "$LLVM_OBJDUMP"
          packages/react-native-speech-phonon/scripts/check-pinned-ios.sh

      # npm publish runs the add-on's `prepare`, whose types build against the core's lib/.
      - name: Build the core for the add-on
        if: env.PACKAGE == 'phonon'
        run: yarn prepare

      # The add-on's own release-it config: phonon-v* tags, makeLatest false. Its npm package
      # needs trusted publishing configured for this workflow too.
      - name: Release the Phonon add-on
        if: env.PACKAGE == 'phonon'
        working-directory: packages/react-native-speech-phonon
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: yarn run -T release-it --ci --npm.skipChecks
