name: I57 ps16k mutant
on:
  push:
    branches: [ci/i57-mutant]
permissions:
  contents: read
  actions: read
defaults:
  run:
    shell: bash
env:
  ANDROID_NDK_VERSIONS: '27.1.12297006 28.2.13676358'
jobs:
  emu:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        rep: [1, 2, 3]
        api: ['35', '36', '37.1']
    name: mutant (${{ matrix.api }}, ${{ matrix.rep }})
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: apk
          run-id: 42670004672
          github-token: ${{ github.token }}
      - run: .i57/mutate.sh
      - uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: ~/phonon-model
          key: phonon-31m-en-${{ hashFiles('example/src/utils/phononPins.json') }}
      - run: packages/react-native-speech-phonon/scripts/fetch-ci-model.sh "$HOME/phonon-model"
      - run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis_ps16k
          ram-size: 6144M
          disable-animations: true
          script: .i57/run.sh
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: mut-${{ matrix.api }}-${{ matrix.rep }}
          path: emulator-evidence/
          if-no-files-found: ignore
