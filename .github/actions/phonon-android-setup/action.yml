name: Phonon Android setup
description: JDK, Android SDK licenses and NDKs, and the Gradle cache

inputs:
  export-ndk-home:
    description: "'true' sets ANDROID_NDK_HOME to the runner's latest NDK"
    default: 'false'

runs:
  using: composite
  steps:
    - name: Install JDK
      uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
      with:
        distribution: 'zulu'
        java-version: '17'

    # Installs $ANDROID_NDK_VERSIONS from the calling workflow's env.
    - name: Finalize Android SDK
      shell: bash
      env:
        EXPORT_NDK_HOME: ${{ inputs.export-ndk-home }}
      run: |
        /bin/bash -c "yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null"
        for v in $ANDROID_NDK_VERSIONS; do
          for i in 1 2 3; do
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$v" >/dev/null && break
            [ "$i" = 3 ] && exit 1
            sleep 10
          done
        done
        if [ "$EXPORT_NDK_HOME" = true ]; then
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >>"$GITHUB_ENV"
        fi

    - name: Cache Gradle
      uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
      with:
        path: |
          ~/.gradle/wrapper
          ~/.gradle/caches
        key: ${{ runner.os }}-gradle-phonon-${{ hashFiles('example/android/gradle/wrapper/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-
