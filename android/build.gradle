buildscript {
  ext.getExtOrDefault = {name ->
    return rootProject.ext.has(name) ? rootProject.ext.get(name) : project.properties['RNSpeech_' + name]
  }

  repositories {
    google()
    mavenCentral()
  }

  dependencies {
    classpath "com.android.tools.build:gradle:8.7.2"
    // noinspection DifferentKotlinGradleVersion
    classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:${getExtOrDefault('kotlinVersion')}"
  }
}


apply plugin: "com.android.library"
apply plugin: "kotlin-android"

apply plugin: "com.facebook.react"

def getExtOrIntegerDefault(name) {
  return rootProject.ext.has(name) ? rootProject.ext.get(name) : (project.properties["RNSpeech_" + name]).toInteger()
}

// Phonon (opt-in): RNSpeech_phononEnabled=true in gradle.properties or rootProject.ext.
// Optional: RNSpeech_phononAbis (default arm64-v8a), RNSpeech_phononLibDir (local jniLibs dir,
// skips the download), and debug-only RNSpeech_phononForceReason / RNSpeech_phononSkipHwcapGate.
def getPhononOption(name) {
  def extName = "RNSpeech_" + name
  def value = rootProject.ext.has(extName) ? rootProject.ext.get(extName) : getExtOrDefault(name)
  return value == null ? null : value.toString().trim()
}

def phononRequested = (getPhononOption("phononEnabled") ?: "false").toBoolean()
def phononAbis = (getPhononOption("phononAbis") ?: "arm64-v8a").split(",").collect { it.trim() }.findAll { it }
def phononLibDir = getPhononOption("phononLibDir") ?: ""
def phononForceReason = getPhononOption("phononForceReason") ?: ""
// Negative control (DESIGN.md §8.3): debug builds skip the HWCAP gate, so unsupported CPUs SIGILL.
def phononSkipHwcapGate = (getPhononOption("phononSkipHwcapGate") ?: "false").toBoolean()
if (phononSkipHwcapGate) {
  logger.warn("RNSpeech: RNSpeech_phononSkipHwcapGate=true: DEBUG builds skip the Phonon HWCAP " +
      "gate (negative-control evidence build; unsupported CPUs will crash). Never ship this.")
}
def phononLock = new groovy.json.JsonSlurper().parse(file("../phonon.lock.json"))
def phononVersion = phononLock.binaries.release.toString().replaceFirst(/^phonon-bin-v/, "")
def phononEnabled = phononRequested
if (phononRequested && phononLibDir.isEmpty() && phononLock.binaries.android.sha256 == "PLACEHOLDER") {
  logger.warn("RNSpeech: RNSpeech_phononEnabled=true but phonon.lock.json has no published " +
      "Android binaries yet (sha256 PLACEHOLDER). Building WITHOUT Phonon. " +
      "Set RNSpeech_phononLibDir to a local jniLibs dir to use local binaries.")
  phononEnabled = false
}
if (phononEnabled && !phononLibDir.isEmpty()) {
  phononVersion = phononVersion + "+local"
}
if (phononEnabled && !file("phonon.gradle").exists()) {
  throw new GradleException("RNSpeech: Phonon is enabled but android/phonon.gradle is missing")
}
ext.rnSpeechPhonon = [
  enabled: phononEnabled,
  abis: phononAbis,
  libDir: phononLibDir,
  version: phononVersion,
  lock: phononLock,
]

android {
  namespace "com.pocketpalai.speech"

  compileSdkVersion getExtOrIntegerDefault("compileSdkVersion")

  defaultConfig {
    minSdkVersion getExtOrIntegerDefault("minSdkVersion")
    targetSdkVersion getExtOrIntegerDefault("targetSdkVersion")
    consumerProguardFiles "proguard-rules.pro"

    def traceEnabled = project.hasProperty('RN_SPEECH_TRACE') ?
        project.property('RN_SPEECH_TRACE').toString().toBoolean() : false
    buildConfigField "boolean", "RN_SPEECH_TRACE", traceEnabled.toString()

    buildConfigField "boolean", "RN_SPEECH_PHONON", phononEnabled.toString()
    buildConfigField "String", "RN_SPEECH_PHONON_ABIS", "\"${phononEnabled ? phononAbis.join(',') : ''}\""
    buildConfigField "String", "RN_SPEECH_PHONON_VERSION", "\"${phononEnabled ? phononVersion : ''}\""

    externalNativeBuild {
      cmake {
        cppFlags "-std=c++17 -fexceptions -frtti"
        arguments "-DANDROID_STL=c++_shared", "-DRN_SPEECH_PHONON=${phononEnabled ? 'ON' : 'OFF'}"
      }
    }

    ndk {
      abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86', 'x86_64'
    }
  }

  externalNativeBuild {
    cmake {
      path "src/main/cpp/CMakeLists.txt"
      version "3.22.1"
    }
  }

  buildFeatures {
    buildConfig true
  }

  buildTypes {
    debug {
      buildConfigField "String", "RN_SPEECH_PHONON_FORCE_REASON", "\"${phononForceReason}\""
      buildConfigField "boolean", "RN_SPEECH_PHONON_SKIP_HWCAP_GATE", phononSkipHwcapGate.toString()
    }
    release {
      minifyEnabled false
      buildConfigField "String", "RN_SPEECH_PHONON_FORCE_REASON", "\"\""
      buildConfigField "boolean", "RN_SPEECH_PHONON_SKIP_HWCAP_GATE", "false"
    }
  }

  testOptions {
    unitTests.returnDefaultValues = true
  }

  lintOptions {
    disable "GradleCompatible"
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_1_8
    targetCompatibility JavaVersion.VERSION_1_8
  }

  sourceSets {
    main {
      java.srcDirs += [
        "generated/java",
        "generated/jni"
      ]
      java.srcDirs += phononEnabled ? "src/phonon/java" : "src/phononStub/java"
      // Pure-JVM policy: shipped only when enabled, unit tested always.
      if (phononEnabled) java.srcDirs += "src/phononPure/java"
    }
    test {
      java.srcDirs += phononEnabled ? "src/phononTest/java" : "src/phononStubTest/java"
      if (!phononEnabled) java.srcDirs += "src/phononPure/java"
    }
  }
}

if (phononEnabled) {
  apply from: "phonon.gradle"
}

repositories {
  mavenCentral()
  google()
}

def kotlin_version = getExtOrDefault("kotlinVersion")

dependencies {
  implementation "com.facebook.react:react-android"
  implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
  testImplementation "junit:junit:4.13.2"
}
