# Select ${ENGINE} on the SYS tab and wait until it is initialized.
# Downloads the Kitten ${KITTEN_VARIANT} model when it is missing; other
# engines must already have a model installed on the device.
# ${XNNPACK} is 'on' or 'off' (CPU provider only).
appId: speech.example
---
# The app opens on the SYS tab and auto-initializes the default engine
# (Kitten); on a fresh install that shows "Kitten Model Required" over the
# tabs. Wait for that to settle so the taps below aren't ignored.
- extendedWaitUntil:
    visible: '\[ONLINE\]|\[OFFLINE\]|Kitten Model Required'
    timeout: 120000
- runFlow:
    when:
      visible: 'Kitten Model Required'
      true: ${ENGINE !== 'Kitten' || XNNPACK === 'off'}
    commands:
      - tapOn: 'LATER'
# XNNPACK=off: initialize with the CPU provider only.
- runFlow:
    when:
      visible: '☑ XNNPACK'
      true: ${XNNPACK === 'off'}
    commands:
      - tapOn: '☑ XNNPACK'
# With the prompt open (Kitten requested, model missing) the download
# below handles it; otherwise select the engine.
- runFlow:
    when:
      notVisible: 'Kitten Model Required'
    commands:
      - tapOn: '.*SYS'
      - tapOn: ${ENGINE}
- runFlow:
    when:
      visible: 'Kitten Model Required'
    commands:
      - tapOn: 'DOWNLOAD'
      # Small screens (the CI emulator) can have the card below the fold.
      - scrollUntilVisible:
          element: ${KITTEN_VARIANT}
          direction: DOWN
          timeout: 20000
      - tapOn: ${KITTEN_VARIANT}
      - extendedWaitUntil:
          visible: 'Kitten TTS ${KITTEN_VARIANT} downloaded!'
          timeout: 600000
      - tapOn: 'OK'
      - back
- runFlow:
    when:
      visible: 'INIT'
    commands:
      - tapOn: 'INIT'
- extendedWaitUntil:
    visible: '\[ONLINE\]'
    timeout: 180000
