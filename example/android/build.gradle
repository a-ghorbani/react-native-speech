buildscript {
    ext {
        buildToolsVersion = "37.0.0"
        minSdkVersion = 24
        compileSdkVersion = 37
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.2.0"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

// -PRNSpeech_phononLocal=true: build the Phonon add-on against its scripts/build-android.sh
// output in this checkout instead of the released binaries.
if ((findProperty("RNSpeech_phononLocal") ?: "false").toString().toBoolean()) {
    def localLibs = file("../../packages/react-native-speech-phonon/scripts/out/android/jniLibs")
    if (!localLibs.isDirectory()) {
        throw new GradleException("RNSpeech_phononLocal: ${localLibs} not found; " +
            "run packages/react-native-speech-phonon/scripts/build-android.sh first")
    }
    if (findProperty("RNSpeech_phononLibDir") == null) {
        ext.RNSpeech_phononLibDir = localLibs.absolutePath
    }
}

apply plugin: "com.facebook.react.rootproject"
